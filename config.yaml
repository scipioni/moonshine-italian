# moonshine-italian: pipeline configuration (single source of truth).
# Private values (HF_TOKEN) live in .env, never here.

base_model:
  id: "moonshine-ai/moonshine-streaming-small"
  architecture: "streaming-small"
  params_million: 123
  # Fallback ladder (design D3). One of: "streaming-small", "non_streaming_base", "lora"
  selected_base: "streaming-small"

paths:
  data: "data"
  results: "results"
  artifacts: "artifacts"
  hf_cache: "data/hf-cache"

hardware_profiles:
  rocm12g:
    device: "cuda"          # ROCm surfaces as cuda/HIP in torch
    accelerator_kind: "rocm"
    batch_size: 8
    # bf16: hit a 100% deterministic amdgpu VM page fault (GCVM_L2_
    # PROTECTION_FAULT) at a fixed step/batch during final training. Ruled
    # out: corrupt audio (scanned clean), DataLoader workers (crashes with
    # num_workers=0 too), a single large gradient spike (added a >150 gnorm
    # skip guard -- never triggered, crash unchanged), corrupted weights
    # (0 non-finite values, normal magnitudes right before the fatal batch).
    # A checkpoint round-trip's tiny precision perturbation was enough to
    # avoid the crash entirely -- this is a knife-edge bf16 numerical/kernel
    # edge case, not a robust one.
    # Tried fp32 as a workaround: this GPU's fp32 matmul throughput is
    # catastrophically worse than bf16 (not a small multiplier -- ~15-60x
    # slower and erratic, turning the ~11.5h run into an estimated 2-3
    # weeks). Reverted to bf16 as unusable in fp32 for this workload. Next
    # real diagnostic step is rocgdb + a captured coredump (currently
    # blocked on rocgdb not being installed) to identify the actual faulting
    # kernel.
    precision: "bf16"
    num_workers: 4
    ort_provider: "DmlExecutionProvider"  # unused on CPU-only ORT; native ORT ROCm default
    steps_per_second_min: 0.3   # measured ~1.7/s
  strix:
    device: "cuda"
    accelerator_kind: "rocm"
    batch_size: 32
    # NOTE: Strix is benched for training — a 26 GB ollama model is pinned to
    # the same unified-memory iGPU, causing intermittent pathological slowdown
    # (60–128 s/step). Final training runs on rocm12g. See docs/results.md.
    precision: "bf16"
    num_workers: 8
    ort_provider: "ROCMExecutionProvider"
    steps_per_second_min: 0.3   # placeholder; Strix not used for training
  cuda:
    device: "cuda"
    accelerator_kind: "cuda"
    batch_size: 8
    precision: "bf16"
    num_workers: 8
    ort_provider: "CUDAExecutionProvider"
    steps_per_second_min: 0.3

datasets:
  fleurs:
    repo: "google/fleurs"
    config: "it_it"
    enabled: true
    gated: false
  mls:
    repo: "facebook/multilingual_librispeech"
    config: "italian"
    enabled: true
    gated: false
    parquet:
      repo: "facebook/multilingual_librispeech"
      splits:
        train: "italian/train-*.parquet"
        validation: "italian/dev-*.parquet"
        test: "italian/test-*.parquet"
  common_voice:
    repo: "mozilla-foundation/common_voice_21_0"   # kept for reference; unreachable, see note
    config: "it"
    enabled: true
    gated: false
    local:
      # mozilla-foundation/common_voice_* on HF returns 404 (repo removed).
      # Sourced instead as a local CC0 archive from mozilladatacollective.com;
      # path comes from CV_ARCHIVE_PATH in .env (see .env.example). download.py
      # extracts only the clips referenced by train/dev/test.tsv into
      # data/raw/common_voice_it/.
      archive_env: "CV_ARCHIVE_PATH"
      inner_prefix: "cv-corpus-26.0-2026-06-12/it"
      splits: { train: "train.tsv", validation: "dev.tsv", test: "test.tsv" }
    note: >
      CC0-licensed. train.tsv/dev.tsv/test.tsv are Common Voice's own
      speaker-balanced, validated splits — no extra vote filtering applied.

preparation:
  target_sr: 16000
  mono: true
  min_duration_s: 1.0
  max_duration_s: 10.0
  vad:
    backend: "silero"        # "silero" or "energy"
    threshold: 0.5
    min_speech_ms: 250
    min_silence_ms: 100
  transcript_normalization:
    lowercase: true
    expand_numbers: true
    keep_accents: true       # always true in code; recorded for clarity

smoke:
  dataset: "fleurs"
  train_samples: 200
  eval_samples: 40
  seed: 1234
  max_train_steps: 60
  slice_manifest: "data/manifests/smoke"

training:
  optimizer: "schedulefree_adamw"
  learning_rate: 5.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.01
  warmup_steps: 500
  # Skip the optimizer step (in addition to the existing non-finite skip
  # below) when the pre-clip grad norm exceeds this, even though it's
  # finite. General safety net -- kept even though it did NOT explain or fix
  # the rocm12g crash documented at shuffle_seed below (that crash's peak
  # gnorm was 77.5, well under this).
  max_grad_norm_skip: 150.0
  # DataLoader shuffle seed (train_loop.py), deliberately separate from
  # smoke.seed: on rocm12g, resuming training from checkpoint-1000 hit a
  # 100% deterministic amdgpu VM page fault (GCVM_L2_PROTECTION_FAULT) at a
  # fixed step/batch, every single retry -- because that resume always
  # rebuilt the DataLoader with the same seed (smoke.seed + start_step),
  # producing the identical shuffle order and re-walking into the same fault
  # every time. Root cause not found despite a full investigation: not
  # corrupt audio (scanned clean), not DataLoader workers (crashes with
  # num_workers=0 too), not a single large gradient spike (max_grad_norm_skip
  # above never triggered), not corrupted weights (0 non-finite values,
  # normal magnitudes right before the fatal batch), not fp32 vs bf16 alone
  # (fp32 sidesteps it but is 15-60x slower on this GPU, impractical), and a
  # captured GPU coredump couldn't be parsed by rocgdb (gfx1200/RDNA4 is very
  # new hardware; likely a ROCm 7.2.4 tooling gap, not something fixable
  # here). This value only changes which shuffle order training uses --
  # bumping it is a workaround (escapes this specific deterministic path),
  # not a fix. If a similar hard crash recurs, don't assume changing this
  # again will help twice.
  shuffle_seed: 20260826
  chunked_augmentation:
    enabled: true
    probability: 0.3
    min_fraction: 0.4        # keep at least this fraction of each utterance
  profiles:
    smoke:
      output_dir: "results/train-smoke"
      max_steps: 60
      eval_steps: 30
      save_steps: 30
      curriculum: []          # no staging on smoke: single short stage
      gate: "smoke"
    final:
      output_dir: "results/train-final"
      # 2 epochs over the mls+common_voice+fleurs mix: 285,401 train rows /
      # batch 8 (rocm12g) = 35,675 steps/epoch (drop_last) -> 71,350 for 2
      # epochs, rounded to 72000. At the measured 1.7337 steps/s (from a
      # prior run's run_metadata.json -- forward/backward/optimizer.step all
      # ran every step even before the resume-optimizer-binding fix, so the
      # per-step cost is representative) that's ~11.5h wall time. Was 40000
      # (~2.9 epochs) when training was mls-only (110,004 rows); the curriculum
      # below needs no change -- stage_for_step() holds at its last entry
      # (max_audio_s: 30.0, uncapped) for any step past its 40000-step sum.
      max_steps: 72000
      eval_steps: 1000
      save_steps: 1000
      # Training manifests to concatenate (data/prepared/<name>/train.jsonl).
      # mls is 216.7h of 19th-century audiobook narration from a handful of
      # narrators; common_voice adds 205.9h from 7,342 speakers (CC0,
      # crowd-read; measured post-VAD-trim -- raw clip_durations.tsv sums to
      # 255.8h before silence/no-speech trimming); fleurs adds 4.35h in the
      # eval domain itself (modern news, same register as the FLEURS-it test
      # set the release gates measure against). In-loop eval stays on
      # mls/validation.jsonl regardless of this list, so the eval/wer curve
      # stays comparable step-to-step as the mix changes.
      datasets: ["mls", "common_voice", "fleurs"]
      curriculum:
        - { steps: 8000, max_audio_s: 5.0, description: "short clips" }
        - { steps: 16000, max_audio_s: 10.0, description: "medium clips" }
        - { steps: 16000, max_audio_s: 30.0, description: "full length" }
      gate: "final"

evaluation:
  full_utterance: true
  # Sample count for the in-training eval hook. Was hard-coded to 8, which is
  # ~100 reference words -- a 1-WER-point granularity, far too coarse to steer
  # a 40k-step run and not comparable to the gate numbers.
  in_loop_samples: 64
  streaming:
    enabled: true
    hop_ms: 100              # allowed range 32..100
    speculative_decoding: true
    max_tokens_per_second: 13.0
  jiwer:
    wer: true
    cer: true
  gates:
    smoke:                   # process-validation gate, relative to baseline
      mode: "full"
      max_wer: 1.10          # ratio vs spike baseline WER on the same slice
      relative_to: "baseline"
      note: "smoke gate validates the process; compare against baseline JSON"
    final:
      mode: "streaming"
      max_wer: 0.15          # absolute streaming WER
      relative_to: "absolute"
      full_utterance_wer_max: 0.20
    post_quant:              # INT8 .ort bundle vs the pre-quant checkpoint
      mode: "streaming"
      max_wer: 1.25          # ratio vs the same checkpoint's streaming WER
      relative_to: "baseline"
      note: >
        post-quantization degradation gate; measured on the .ort bundle in
        streaming mode, baseline = the PyTorch checkpoint's streaming WER
        on the same slice. Blocks release promotion on failure.

export:
  onnx:
    tolerance: 2.0e-2
    opset: 17
  quantization: "int8"       # int8 | fp16 | none
  ort:
    size_report: true

release:
  dir: "artifacts/release"

board:
  host: "arduino@moonshine.local"                   # set in .env as BOARD_HOST for private deployment info
  user: "root"
  deploy_path: "/opt/moonshine-it"
  test_clip: "artifacts/test/it_test_clip.wav"
  budget:
    redecode_ms_max: 1500
    line_latency_ms_max: 3000
    rss_mb_max: 2048
